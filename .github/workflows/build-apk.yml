name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Analyze, test and build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        # Pinned to 3.47.9, same version used locally. The project uses
        # Gradle 9.3.1 + AGP 9.1.0 (generated by this Flutter version).
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        # Mel frontend + tokenizer tests. The e2e test skips itself
        # without STT_FP32_DIR (local verification only).
        run: flutter test

      - name: Build Debug APK
        # --split-per-abi + --target-platform android-arm64 produces ONE
        # APK (app-arm64-v8a-debug.apk) with arm64 native libs only.
        # Debug build: no signing secrets needed.
        run: |
          flutter build apk \
            --debug \
            --split-per-abi \
            --target-platform android-arm64 \
            --build-number=${{ github.run_number }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: stt-test-app-debug-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          retention-days: 30
