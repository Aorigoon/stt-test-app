name: Release Debug APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build and Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: |
          flutter build apk \
            --debug \
            --split-per-abi \
            --target-platform android-arm64 \
            --build-name=${{ github.event.inputs.version }} \
            --build-number=${{ github.run_number }}

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk \
             build/app/outputs/flutter-apk/stt-test-${{ github.event.inputs.version }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: STT Test v${{ github.event.inputs.version }}
          body: |
            ## STT Test v${{ github.event.inputs.version }}

            Test build of the from-scratch multilingual streaming STT model (s1 checkpoint, 11 epochs, int8 ONNX).

            - English only for now (test build)
            - Mic recording + 3 bundled samples
            - Shows transcript, latency ms, RTF — Copy Result button included
            - Debug build, arm64 only
          draft: false
          prerelease: true
          files: build/app/outputs/flutter-apk/stt-test-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
