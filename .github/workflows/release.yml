name: Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.2)'
        required: true
        default: '1.0.2'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build and Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reassemble split encoder model
        run: bash tools/reassemble_models.sh

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Set up release signing
        run: |
          echo "${{ secrets.STT_TEST_KEYSTORE_BASE64 }}" | base64 --decode > android/app/stt-test-release.jks

      - name: Build Release APK
        # --split-per-abi + --target-platform android-arm64 produces ONE
        # APK (app-arm64-v8a-release.apk) with arm64 native libs only.
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --target-platform android-arm64 \
            --build-name=${{ github.event.inputs.version }} \
            --build-number=${{ github.run_number }} \
            --dart-define=APP_VERSION=${{ github.event.inputs.version }} \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols
        env:
          STT_TEST_KEYSTORE_FILE: stt-test-release.jks
          STT_TEST_STORE_PASSWORD: ${{ secrets.STT_TEST_STORE_PASSWORD }}
          STT_TEST_KEY_PASSWORD: ${{ secrets.STT_TEST_KEY_PASSWORD }}
          STT_TEST_KEY_ALIAS: ${{ secrets.STT_TEST_KEY_ALIAS }}

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             build/app/outputs/flutter-apk/stt-test-${{ github.event.inputs.version }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: STT Test v${{ github.event.inputs.version }}
          body: |
            ## STT Test v${{ github.event.inputs.version }}

            Test build of the from-scratch multilingual streaming STT model (v0 final, 35 epochs, int8 ONNX).

            - Final v0 model: 35/35 epochs, val WER 0.53 (en 0.45, es 0.36)
            - Fixed: encoder adapter bug — lang_ids now switches adapters at runtime (was English-only)
            - Fixed: Copy Result now shows the real app version
            - Release-signed build (installs over v1.0.1; uninstall the v1.0.0 debug APK first — different signature)
            - English only for now (test build)
            - Mic recording + 3 bundled samples
            - Shows transcript, latency ms, RTF — Copy Result button included
            - arm64 only
          draft: false
          prerelease: true
          files: build/app/outputs/flutter-apk/stt-test-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
